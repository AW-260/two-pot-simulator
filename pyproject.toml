[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twopot"
version = "0.1.0"
description = "Prices a South African two-pot savings withdrawal as a loan from your future self."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
